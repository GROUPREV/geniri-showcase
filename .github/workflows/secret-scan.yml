name: Secret scan

# The job name below is the string wired as a required status check. Renaming it
# blocks every pull request until the ruleset is updated in the same change.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks scans history, not the diff: a credential that was committed
          # and then removed is still a leaked credential.
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          # A release download is a network call to a CDN, and on 26 October 2026
          # it answered 504 on a push to main. That failure says nothing about the
          # repository, so retry it rather than reporting a red required check.
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors --max-time 120 \
            -o "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.27.2/gitleaks_8.27.2_linux_x64.tar.gz
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/gitleaks" detect --source . --exit-code 1
